<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lassulus was here</title>
    <link rel="stylesheet" href="/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/maps.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font: 16px/1.4 monospace;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #map {
        flex: 1;
        min-height: 40vh;
      }
      #panel {
        padding: 1em;
      }
      #when,
      #coords {
        margin: 0 0 0.75em;
      }
      #coords {
        user-select: all;
        color: #aaa;
      }
      #live {
        display: block;
        margin-top: 1em;
        color: #9cf;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <p id="when"></p>
      <p id="coords"></p>
      <div id="open" class="open"></div>
      <a id="live" href="/">live location →</a>
    </div>
    <script src="/leaflet/leaflet.js"></script>
    <script src="/maps.js"></script>
    <script>
      (function () {
        // /at#LAT,LON[@UNIXTIME]; the fragment never reaches the server
        window.addEventListener("hashchange", function () {
          location.reload();
        });
        var m = /^#(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)(?:@(\d+))?$/.exec(
          location.hash,
        );
        var lat = m && parseFloat(m[1]),
          lon = m && parseFloat(m[2]);
        var when = document.getElementById("when");
        if (!m || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
          document.getElementById("map").remove();
          when.textContent = "no location in this link";
          return;
        }

        var map = L.map("map").setView([lat, lon], 16);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);
        L.marker([lat, lon]).addTo(map);

        if (m[3]) {
          var t = new Date(parseInt(m[3], 10) * 1000);
          when.textContent = "lassulus was here at " + t.toLocaleString();
        } else {
          when.textContent = "lassulus was here";
        }
        document.getElementById("coords").textContent = lat + ", " + lon;

        renderMapLinks(document.getElementById("open"), lat, lon);
      })();
    </script>
  </body>
</html>
